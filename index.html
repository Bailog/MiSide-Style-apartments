<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiSide-квартира</title>
  <style>
    :root { --ink: #f6eefe; --accent: #ff8fc8; --panel: rgba(22, 12, 40, 0.82); --line: rgba(255, 180, 230, 0.25); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0816; color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hidden { display: none !important; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
      background: radial-gradient(ellipse at center, rgba(40, 18, 70, 0.55), rgba(8, 4, 18, 0.85)); }
    .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 28px 34px; max-width: 420px; margin: 16px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.02em; }
    h1 span { color: var(--accent); }
    p { margin: 6px 0; opacity: 0.85; line-height: 1.45; }
    #start { margin: 18px 0 10px; font: inherit; font-size: 18px; padding: 12px 34px; border-radius: 999px;
      border: none; cursor: pointer; color: #2a0f2e; background: linear-gradient(135deg, #ffb3d9, #c9a8ff); }
    #start:hover { filter: brightness(1.08); }
    #start:disabled { opacity: 0.6; cursor: progress; }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; margin: 14px auto 4px;
      width: fit-content; font-size: 14px; }
    kbd { background: rgba(255, 255, 255, 0.12); border-radius: 5px; padding: 1px 7px; font: inherit; font-size: 13px; }
    .row { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .pill { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
      color: var(--ink); background: transparent; border: 1px solid rgba(255, 255, 255, 0.25); }
    .pill:hover { border-color: var(--accent); }
    .pill.on { background: rgba(255, 143, 200, 0.3); border-color: var(--accent); }
    #devOpen { margin-top: 14px; }
    .lang { position: absolute; top: 12px; right: 14px; display: flex; gap: 2px; }
    .lang .pill { padding: 2px 8px; font-size: 12px; }
    #fps { position: fixed; left: 12px; top: 10px; z-index: 1; font-size: 12px; opacity: 0.7;
      background: rgba(10, 5, 20, 0.45); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
    #toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -10px); z-index: 3; opacity: 0;
      background: var(--panel); padding: 8px 16px; border-radius: 999px; font-size: 14px; pointer-events: none;
      transition: opacity 0.3s, transform 0.3s; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.55); z-index: 1; pointer-events: none; }
    /* Development window */
    #dev { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; background: rgba(6, 3, 14, 0.7); }
    .dev-card { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
    .dev-card header { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px;
      border-bottom: 1px solid var(--line); }
    .dev-card h2 { margin: 0; font-size: 20px; }
    #devClose { font: inherit; font-size: 22px; line-height: 1; width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25); background: transparent; color: var(--ink); cursor: pointer; }
    #devClose:hover { border-color: var(--accent); }
    #devBody { overflow-y: auto; padding: 6px 22px 22px; }
    #devBody section { margin-top: 16px; }
    #devBody h3 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
    #devBody p { text-align: left; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
    .thumbs img { width: 100%; height: 90px; object-fit: cover; border-radius: 8px; background: #1a1028;
      border: 1px solid rgba(255, 255, 255, 0.12); user-select: none; }
    .scheme { display: block; width: 100%; max-width: 520px; margin: 10px auto 0; border-radius: 8px; background: #fff;
      user-select: none; }
    .prompt { white-space: pre-wrap; text-align: left; font: inherit; font-size: 13px; line-height: 1.5; margin: 10px 0 0;
      padding: 12px 14px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.min.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <div id="fps" class="hidden"></div>
  <div id="overlay">
    <div class="card">
      <div class="lang">
        <button class="pill" data-lang="ru">RU</button>
        <button class="pill" data-lang="en">EN</button>
      </div>
      <h1 data-i18n="title">Квартира в стиле <span>MiSide</span></h1>
      <p data-i18n="subtitle"></p>
      <button id="start" disabled>Загрузка…</button>
      <div class="keys">
        <kbd>W A S D</kbd><span data-i18n="keyMove"></span>
        <kbd data-i18n="keyMouse"></kbd><span data-i18n="keyLook"></span>
        <kbd>Esc</kbd><span data-i18n="keyPause"></span>
        <kbd>G</kbd><span data-i18n="keyQuality"></span>
      </div>
      <div class="row">
        <button class="pill" data-quality="low" data-i18n="qLow"></button>
        <button class="pill" data-quality="medium" data-i18n="qMedium"></button>
        <button class="pill" data-quality="high" data-i18n="qHigh"></button>
      </div>
      <button id="devOpen" class="pill" data-i18n="dev"></button>
    </div>
  </div>
  <div id="dev" class="hidden" role="dialog" aria-modal="true">
    <div class="dev-card">
      <header>
        <h2 data-i18n="dev"></h2>
        <button id="devClose" data-i18n-title="close">×</button>
      </header>
      <div id="devBody"></div>
    </div>
  </div>
  <noscript>Для просмотра нужен браузер с поддержкой JavaScript и WebGL 2.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
