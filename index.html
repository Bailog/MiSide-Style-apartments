<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiSide-квартира</title>
  <style>
    :root { --ink: #f6eefe; --accent: #ff8fc8; --panel: rgba(22, 12, 40, 0.78); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0816; color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #overlay { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
      background: radial-gradient(ellipse at center, rgba(40, 18, 70, 0.55), rgba(8, 4, 18, 0.85)); }
    #overlay.hidden, #hud.hidden { display: none; }
    .card { background: var(--panel); border: 1px solid rgba(255, 180, 230, 0.25); border-radius: 18px;
      padding: 28px 34px; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
    h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.02em; }
    h1 span { color: var(--accent); }
    p { margin: 6px 0; opacity: 0.85; line-height: 1.45; }
    #start { margin: 18px 0 10px; font: inherit; font-size: 18px; padding: 12px 34px; border-radius: 999px;
      border: none; cursor: pointer; color: #2a0f2e; background: linear-gradient(135deg, #ffb3d9, #c9a8ff); }
    #start:hover { filter: brightness(1.08); }
    .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; margin: 14px auto 4px;
      width: fit-content; font-size: 14px; }
    kbd { background: rgba(255, 255, 255, 0.12); border-radius: 5px; padding: 1px 7px; font: inherit; font-size: 13px; }
    .quality { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .quality button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
      color: var(--ink); background: transparent; border: 1px solid rgba(255, 255, 255, 0.25); }
    .quality button.on { background: rgba(255, 143, 200, 0.3); border-color: var(--accent); }
    #hud { position: fixed; left: 14px; bottom: 12px; z-index: 1; font-size: 12px; opacity: 0.7;
      background: rgba(10, 5, 20, 0.45); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
    #hud.collapsed .help { display: none; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.55); z-index: 1; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.min.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="overlay">
    <div class="card">
      <h1>Квартира в стиле <span>MiSide</span></h1>
      <p>Ночная прогулка по квартире: кухня-гостиная, холл и уголок с компьютером.</p>
      <button id="start">Войти</button>
      <div class="keys">
        <kbd>W A S D</kbd><span>идти (или стрелки)</span>
        <kbd>Мышь</kbd><span>осмотреться</span>
        <kbd>Esc</kbd><span>пауза</span>
        <kbd>G</kbd><span>качество графики</span>
        <kbd>H</kbd><span>скрыть подсказку</span>
      </div>
      <div class="quality">
        <button data-quality="low">Низкое</button>
        <button data-quality="medium">Среднее</button>
        <button data-quality="high">Высокое</button>
      </div>
    </div>
  </div>
  <div id="hud" class="hidden"><span id="fps"></span><span class="help"> · WASD — идти, Esc — пауза, G — качество</span></div>
  <noscript>Для просмотра нужен браузер с поддержкой JavaScript и WebGL 2.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
